name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...
      - name: py_compile agent.py
        run: python3 -m py_compile contrib/agent.py
      - name: worker + panel JS syntax
        run: |
          node --check worker/src/index.js
          node --check worker/src/fleet.js
          node --check internal/panel/index.js
          node --check internal/panel/term.js
      - name: worker assets in sync
        run: |
          ./worker/sync-assets.sh
          if ! git diff --exit-code worker/public; then
            echo "worker/public is stale: run ./worker/sync-assets.sh and commit"; exit 1
          fi
