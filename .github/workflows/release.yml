name: release

# Tag vX.Y.Z -> test, then publish raw binaries named popfleet-<os>-<arch>
# (contrib/agent.sh curls them straight from releases/latest/download/ and
# chmods the result, so NO tarballs) plus checksums.txt, plus a multi-arch
# agent image at ghcr.io/ejoliet/popfleet-agent.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A broken tag is worse than no tag: nothing publishes unless this passes.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath \
                -ldflags="-s -w -X github.com/ejoliet/popfleet/internal/agent.Version=$VERSION" \
                -o "dist/popfleet-${target%/*}-${target#*/}" .
          done
          (cd dist && sha256sum popfleet-* > checksums.txt)
          ls -l dist
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/ejoliet/popfleet-agent:${{ steps.ver.outputs.version }}
            ghcr.io/ejoliet/popfleet-agent:latest
